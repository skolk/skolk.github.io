<head>
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="theme-color" content="#1B242B" id="theme-color-meta">

      <!-- Day / dusk / night. Runs before the body parses so the page never
           paints the wrong ground. A saved choice wins, otherwise follow the
           system. Same palette and same storage idiom as /doors. -->
      <script>
      (function(){
        var BAR = {day:"#E3D7BF", dusk:"#1B242B", night:"#0D0605"}, t = null;
        try { t = localStorage.getItem("skolk.theme"); } catch(e){}
        if (!BAR[t]) t = matchMedia("(prefers-color-scheme: light)").matches ? "day" : "dusk";
        if (t !== "dusk") document.documentElement.classList.add(t);
        var m = document.getElementById("theme-color-meta");
        if (m) m.setAttribute("content", BAR[t]);
      })();
      </script>
    
      <!-- Favicon -->
      <link rel="icon" href="{{ "/images/favicon.png" | prepend: site.baseurl }}">
    
      <!-- Meta information -->
      <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
      <meta name="description"
            content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
      <link rel="canonical"
            href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}" />
    
      <meta property="og:image" content="{{ "/images/favicon.png" | prepend: site.baseurl }}">
      
      <!-- hack.css base -->
      <link rel="stylesheet" href="https://npmcdn.com/hack/dist/hack.css" />
      
      <!-- hack.css standard is the type and spacing only, it carries almost no
           colour. Colour comes from the three palettes in main.scss. -->
      <link rel="stylesheet" href="https://npmcdn.com/hack/dist/standard.css" id="theme-standard" />
    
      <!-- Prism.js -->
      <link rel="stylesheet" href="https://npmcdn.com/prismjs@1.5.1/themes/prism.css" />
    
      <!-- Custom style -->
      <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}" />
    
      <style>
        /* the only cross-theme transition worth keeping */
        body { transition: background-color .3s ease, color .3s ease; }
        a { transition: color .3s ease; }
      </style>

      <!-- Feed -->
      <link rel="alternate" type="application/rss+xml" title="{{ site.title }}"
            href="{{ "/feed.xml" | prepend: site.baseurl }}" />
    
      <!-- 'jekyll-seo' plugin -->
      {% seo %}
    </head>
