<!DOCTYPE html>
<html>

  {% include head.html %}

  <body class="standard" id="theme-body">

    {% include github-ribbon.html %}

    <div class="container">
      <div class="grid">
        <aside class="cell -3of12" role="navigation">
          {% include navigation.html %}
        </aside>

        <main class="cell -9of12">
          {{ content }}
        </main>
      </div>

    {% include footer.html %}

    </div>

    <!-- Prism.js -->
    <script src="https://npmcdn.com/prismjs@1.5.1/prism.js"></script>
    
    <!-- Day / dusk / night. The pre-paint script in head.html already picked
         and applied one; this only wires the switch and keeps the label honest. -->
    <script>
      (function(){
        var KEY = 'skolk.theme';
        var BAR = {day:'#E3D7BF', dusk:'#1B242B', night:'#0D0605'};
        var root = document.documentElement;
        var opts = document.querySelectorAll('.theme-option');
        var meta = document.getElementById('theme-color-meta');

        function current(){
          if (root.classList.contains('day')) return 'day';
          if (root.classList.contains('night')) return 'night';
          return 'dusk';
        }

        function apply(t, save){
          root.classList.remove('day', 'night');
          if (t !== 'dusk') root.classList.add(t);
          opts.forEach(function(el){
            var on = el.dataset.theme === t;
            el.classList.toggle('active', on);
            el.textContent = on ? '[' + el.dataset.theme + ']' : el.dataset.theme;
          });
          if (meta) meta.setAttribute('content', BAR[t]);
          if (save) { try { localStorage.setItem(KEY, t); } catch(e){} }
        }

        opts.forEach(function(el){
          el.addEventListener('click', function(){ apply(el.dataset.theme, true); });
        });

        apply(current(), false);

        /* follow the system until the reader picks for themselves */
        matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e){
          var saved = null;
          try { saved = localStorage.getItem(KEY); } catch(err){}
          if (!saved) apply(e.matches ? 'day' : 'dusk', false);
        });
      })();
    </script>
  </body>

</html>
