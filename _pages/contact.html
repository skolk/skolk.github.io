<script>
(function () {
  var K = "petrichor";
  var C = {
    ilab: "AwAVHCkKGwMTHgEYEwtNDAoE"
  };
  var NAME = "Sean Kolk";

  function reveal(k) {
    var b = atob(C[k]), o = "";
    for (var i = 0; i < b.length; i++) {
      o += String.fromCharCode(b.charCodeAt(i) ^ K.charCodeAt(i % K.length));
    }
    return decodeURIComponent(escape(o));
  }

  document.querySelectorAll(".c-row[data-field]").forEach(function (row) {
    row.querySelector("button").addEventListener("click", function () {
      var key = row.getAttribute("data-field");
      var val = reveal(key);
      var a = document.createElement("a");
      a.href = (key === "phone" ? "tel:" + val.replace(/[^+0-9]/g, "") : "mailto:" + val);
      a.textContent = val;
      var slot = row.querySelector(".c-val");
      slot.textContent = "";
      slot.appendChild(a);
      this.remove();
    });
  });

  document.getElementById("c-vcf").addEventListener("click", function () {
    var card = [
      "BEGIN:VCARD", "VERSION:3.0",
      "FN:" + NAME,
      "EMAIL;TYPE=INTERNET,WORK:" + reveal("ilab"),
      "URL:https://islandlab.dev",
      "URL:https://skolk.github.io",
      "END:VCARD"
    ].join("\r\n");
    var url = URL.createObjectURL(new Blob([card], { type: "text/vcard" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = "sean-kolk.vcf";
    a.click();
    URL.revokeObjectURL(url);
  });
})();
</script>
