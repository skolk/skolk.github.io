<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px -apple-system, sans-serif; width: 260px; margin: 0; padding: 12px; }
  h1 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #666; margin: 0 0 8px; }
  label { display: block; padding: 5px 0; cursor: pointer; }
  .hint { color: #888; font-size: 11px; margin: 0 0 10px 21px; }
  button { width: 100%; padding: 7px; margin-top: 10px; cursor: pointer; }
  #out { color: #2e7d32; font-size: 12px; margin-top: 6px; min-height: 14px; }
  hr { border: none; border-top: 1px solid #ddd; margin: 12px 0; }
</style>
</head>
<body>
  <h1>Connection</h1>
  <label><input type="radio" name="mode" value="normal"> Normal</label>
  <label><input type="radio" name="mode" value="offline"> Offline</label>
  <p class="hint">Loaded pages stay viewable, nothing new loads. localhost still works.</p>
  <label><input type="radio" name="mode" value="essentials"> Google only</label>
  <p class="hint">Calendar, Meet, and Gmail stay live; everything else is blocked.</p>
  <hr>
  <h1>Tabs</h1>
  <button id="discard">Discard non-meeting tabs</button>
  <div id="out"></div>
  <script src="popup.js"></script>
</body>
</html>
